// ─── MINI SPARKLINE ───────────────────────────────────────────
function Sparkline({ data, color, width=120, height=36 }) {
  const max = Math.max(...data);
  const min = Math.min(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 6) - 3;
    return `${x},${y}`;
  }).join(' ');
  const area = `0,${height} ${pts} ${width},${height}`;
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{display:'block'}}>
      <defs>
        <linearGradient id={`sg-${color.replace('#','')}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.25"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polygon points={area} fill={`url(#sg-${color.replace('#','')})`}/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      {/* Last dot */}
      {(() => {
        const last = pts.split(' ').pop().split(',');
        return <circle cx={last[0]} cy={last[1]} r="3" fill={color}/>;
      })()}
    </svg>
  );
}

// ─── DONUT CHART ──────────────────────────────────────────────
function DonutChart({ segments, size=80 }) {
  const r = 28, cx = size/2, cy = size/2;
  const circ = 2 * Math.PI * r;
  let cumulative = 0;
  const total = segments.reduce((a, s) => a + s.value, 0);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {segments.map((seg, i) => {
        const pct = seg.value / total;
        const dash = pct * circ;
        const offset = circ - cumulative * circ / total;
        cumulative += seg.value;
        return (
          <circle key={i} cx={cx} cy={cy} r={r}
            fill="none" stroke={seg.color} strokeWidth="10"
            strokeDasharray={`${dash} ${circ - dash}`}
            strokeDashoffset={offset}
            strokeLinecap="butt"
            transform={`rotate(-90 ${cx} ${cy})`}
          />
        );
      })}
      <circle cx={cx} cy={cy} r="18" fill={C.surface}/>
    </svg>
  );
}

// ─── BAR CHART ────────────────────────────────────────────────
function BarChart({ data, color, height=60 }) {
  const max = Math.max(...data.map(d => d.v));
  return (
    <div style={{display:'flex', alignItems:'flex-end', gap:4, height}}>
      {data.map((d, i) => (
        <div key={i} style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:3}}>
          <div style={{
            width:'100%', borderRadius:'3px 3px 0 0',
            background: i === data.length-1 ? color : `${color}66`,
            height: `${(d.v/max)*100}%`,
            minHeight:4, transition:'height 0.5s ease',
          }}></div>
          <span style={{fontSize:9, color:C.textMuted, whiteSpace:'nowrap'}}>{d.l}</span>
        </div>
      ))}
    </div>
  );
}

// ─── AI VIDEO PAGE ────────────────────────────────────────────
function AIVideoPage({ isAdmin, onNavigate }) {
  const [prompt, setPrompt] = useState('');
  const [generating, setGenerating] = useState(false);
  const [focus, setFocus] = useState(false);
  const [cfg, setCfg] = useState({voice:'Paduan Suara', dur:'60 detik', style:'Edukasi', aspect:'9:16 Vertikal'});
  const [toast, setToast] = useState(null);

  const showToast = (msg, type='success') => {
    setToast({msg, type});
    setTimeout(() => setToast(null), 3000);
  };

  const handleGenerate = () => {
    if (!prompt.trim()) { showToast('Masukkan topik atau prompt terlebih dahulu.', 'error'); return; }
    setGenerating(true);
    setTimeout(() => {
      setGenerating(false);
      showToast('Video AI berhasil dibuat! Cek di Pekerjaan Saya.');
    }, 3000);
  };

  const cfgItems = [
    {label:'Suara', key:'voice', opts:['Solo Pria','Solo Wanita','Paduan Suara','Dramatis']},
    {label:'Durasi', key:'dur', opts:['30 detik','45 detik','60 detik','90 detik']},
    {label:'Gaya', key:'style', opts:['Edukasi','Entertainment','Motivasi','Tutorial']},
    {label:'Rasio Aspek', key:'aspect', opts:['9:16 Vertikal','16:9 Horizontal','1:1 Kotak']},
  ];

  const pipeline = ['Script','Voice','Stock','Render','Ekspor'];
  const providers = [
    {l:'Script Gen', v:'OpenAI GPT-4o-mini', ok:true},
    {l:'TTS', v:'OpenAI TTS-1', ok:true},
    {l:'Stock Video', v:'Pexels API', ok:false, note:'API key diperlukan'},
    {l:'Render', v:'FFmpeg 7.x', ok:true},
  ];

  return (
    <div style={{padding:'28px 28px 32px', overflowY:'auto', height:'100%'}}>
      <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:24}}>
        <div style={{width:36, height:36, borderRadius:10, background:C.accentLight, display:'flex', alignItems:'center', justifyContent:'center'}}>
          <Ico.Sparkle s={18} c={C.accent}/>
        </div>
        <div>
          <h1 style={{fontSize:22, fontWeight:800, color:C.text, letterSpacing:'-0.02em', lineHeight:1}}>AI Video</h1>
          <p style={{fontSize:13, color:C.textSec, marginTop:2}}>Buat video otomatis dari topik atau skrip.</p>
        </div>
      </div>

      <div style={{display:'grid', gridTemplateColumns:'1fr 320px', gap:20}}>
        <div>
          {/* Prompt */}
          <div style={{marginBottom:16}}>
            <label style={{display:'block', fontSize:12, fontWeight:700, color:C.textSec, marginBottom:8, textTransform:'uppercase', letterSpacing:'0.06em'}}>Topik / Prompt</label>
            <textarea value={prompt} onChange={e=>setPrompt(e.target.value)}
              onFocus={()=>setFocus(true)} onBlur={()=>setFocus(false)}
              placeholder="Deskripsikan topik video yang ingin dibuat..."
              rows={5}
              style={{
                width:'100%', background:C.surface,
                border:`1.5px solid ${focus ? C.accent+'88' : C.border}`,
                borderRadius:14, padding:'12px 14px', color:C.text, fontSize:13,
                fontFamily:'Plus Jakarta Sans, sans-serif', resize:'none', outline:'none',
                transition:'border-color 0.2s ease, box-shadow 0.2s ease',
                boxShadow: focus ? `0 0 0 3px ${C.accentLight}` : 'none',
              }}
            />
          </div>

          {/* Config 2x2 */}
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:16}}>
            {cfgItems.map(item => (
              <div key={item.key} style={{background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, padding:'11px 14px'}}>
                <div style={{fontSize:10, color:C.textMuted, fontWeight:700, letterSpacing:'0.06em', textTransform:'uppercase', marginBottom:6}}>{item.label}</div>
                <select value={cfg[item.key]} onChange={e=>setCfg(c=>({...c,[item.key]:e.target.value}))}
                  style={{width:'100%', background:'none', border:'none', outline:'none', color:C.text, fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:'Plus Jakarta Sans, sans-serif'}}>
                  {item.opts.map(o=><option key={o} value={o} style={{background:C.surface, color:C.text}}>{o}</option>)}
                </select>
              </div>
            ))}
          </div>

          {/* Generate button */}
          <GenBtn generating={generating} onClick={handleGenerate}/>

          {/* Toast */}
          {toast && (
            <div style={{
              position:'fixed', bottom:28, right:28, zIndex:999,
              background: toast.type==='error' ? C.error : toast.type==='info' ? C.info : C.accent,
              color:'white', borderRadius:12, padding:'12px 18px',
              fontSize:13, fontWeight:600, boxShadow:'0 4px 20px rgba(0,0,0,0.18)',
              animation:'fadeIn 0.25s ease', display:'flex', alignItems:'center', gap:8, cursor:'pointer',
            }} onClick={() => toast.type==='success' && onNavigate && onNavigate('jobs')}>
              {toast.type==='error' ? <Ico.Alert s={14} c="white"/> : <Ico.Check s={14} c="white"/>}
              {toast.msg}
              {toast.type==='success' && <span style={{opacity:0.7, fontSize:11}}>→ Lihat Jobs</span>}
            </div>
          )}

          {/* Pipeline */}
          <div style={{marginTop:16}}>
            <div style={{fontSize:11, color:C.textMuted, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:8}}>Pipeline</div>
            <div style={{display:'flex', gap:6}}>
              {pipeline.map((s,i) => (
                <div key={s} style={{
                  flex:1, padding:'6px 8px', borderRadius:10, textAlign:'center',
                  background: generating&&i===0 ? C.accentLight : C.surface,
                  border:`1px solid ${generating&&i===0 ? C.accent+'55' : C.border}`,
                  fontSize:11, fontWeight:600,
                  color: generating&&i===0 ? C.accent : C.textMuted,
                  transition:'all 0.3s',
                }}>{s}</div>
              ))}
            </div>
          </div>
        </div>

        {/* Right: admin panel or placeholder */}
        <div>
          {isAdmin ? (
            <div style={{background:C.surface, border:`1px solid ${C.border}`, borderRadius:16, padding:'16px 18px'}}>
              <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:14}}>
                <AdminTag/>
                <span style={{fontSize:12, fontWeight:700, color:C.text}}>Provider Stack</span>
              </div>
              <div style={{display:'flex', flexDirection:'column', gap:10}}>
                {providers.map(p => (
                  <div key={p.l} style={{display:'flex', alignItems:'center', gap:10, padding:'9px 12px', borderRadius:10, background:C.surfaceAlt, border:`1px solid ${C.border}`}}>
                    <div style={{width:7,height:7,borderRadius:'50%',flexShrink:0,background:p.ok?C.success:C.error}}></div>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{fontSize:11, color:C.textMuted, marginBottom:1}}>{p.l}</div>
                      <div style={{fontSize:12, fontWeight:600, color:p.ok?C.text:C.error, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{p.v}</div>
                    </div>
                    {!p.ok && <span style={{...mono, fontSize:9, color:C.error, background:C.errorBg, border:`1px solid ${C.error}44`, borderRadius:4, padding:'2px 5px', flexShrink:0, whiteSpace:'nowrap'}}>KEY REQUIRED</span>}
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div style={{background:C.surface, border:`1px solid ${C.border}`, borderRadius:16, padding:'20px', textAlign:'center'}}>
              <div style={{width:48,height:48,borderRadius:14,background:C.accentLight,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}}>
                <Ico.Sparkle s={22} c={C.accent}/>
              </div>
              <div style={{fontSize:13, fontWeight:700, color:C.text, marginBottom:4}}>Tips Pembuatan Video</div>
              <p style={{fontSize:12, color:C.textSec, lineHeight:1.6}}>Gunakan topik yang spesifik untuk hasil terbaik. Tambahkan kata kunci seperti "viral", "edukasi", atau nama target audiens kamu.</p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function GenBtn({ generating, onClick }) {
  const [hover, setHover] = useState(false);
  return (
    <button onClick={onClick} disabled={generating}
      onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
      style={{
        width:'100%', padding:'13px 20px',
        background: generating ? C.surfaceAlt : hover ? C.sidebarActive : C.accent,
        border:'none', borderRadius:12,
        color: generating ? C.textMuted : 'white',
        fontSize:14, fontWeight:800, fontFamily:'Plus Jakarta Sans, sans-serif',
        cursor: generating?'default':'pointer', transition:'all 0.2s ease',
        display:'flex', alignItems:'center', justifyContent:'center', gap:8,
        transform: hover&&!generating ? 'translateY(-2px)' : 'none',
        boxShadow: hover&&!generating ? `0 6px 20px rgba(74,122,101,0.35)` : 'none',
      }}>
      {generating ? <Ico.Loader s={15} c={C.textMuted}/> : <Ico.Sparkle s={15} c="white"/>}
      {generating ? 'Menghasilkan Video...' : 'Hasilkan Video'}
    </button>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('home');
  const [isAdmin, setIsAdmin] = useState(false);

  const navigate = (p) => setPage(p);

  const renderPage = () => {
    switch(page) {
      case 'home':     return <HomePage isAdmin={isAdmin} onNavigate={navigate}/>;
      case 'studio':   return <ClipStudioPage isAdmin={isAdmin} onNavigate={navigate}/>;
      case 'jobs':     return <JobsPage isAdmin={isAdmin} onNavigate={navigate}/>;
      case 'aivideo':  return <AIVideoPage isAdmin={isAdmin} onNavigate={navigate}/>;
      case 'settings': return <SettingsPage isAdmin={isAdmin} onNavigate={navigate}/>;
      default:         return <HomePage isAdmin={isAdmin} onNavigate={navigate}/>;
    }
  };

  return (
    <div style={{
      width:'100vw', height:'100vh', overflow:'hidden',
      display:'flex', background:C.bg,
      fontFamily:'Plus Jakarta Sans, sans-serif',
    }}>
      <Sidebar active={page} onChange={setPage} isAdmin={isAdmin} onToggleAdmin={()=>setIsAdmin(a=>!a)}/>

      <div style={{flex:1, display:'flex', flexDirection:'column', minWidth:0, overflow:'hidden'}}>
        <TopBar isAdmin={isAdmin}/>
        <div style={{flex:1, overflow:'hidden', background:C.bg}}>
          {renderPage()}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
